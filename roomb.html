<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>房间搜证 - ROOM B</title>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-panel: #f5e6d3;
            --bg-panel-light: #e8d5c0;
            --text-light: #3e2f1f;
            --text-warm: #5b3e24;
            --accent: #8b5a2b;
            --accent-hover: #a06b3a;
            --danger: #b0453c;
            --success: #4a6b3a;
            --border-color: #c4a882;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.25);
            --radius: 12px;
            --radius-sm: 8px;
            --font-size-base: 16px;
            --z-bg: 1;
            --z-hotspot: 2;
            --z-modal: 10;
            --z-modal-content: 11;
            --z-evidence-panel: 60;
            --z-backpack-panel: 70;
            --z-selected-item: 80;
            --z-toast: 100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            font-size: var(--font-size-base);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        #main-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0a12;
        }

        #bg-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: var(--z-bg);
        }

        #bg-container img#bg-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 0.5s ease;
        }

        .hotspot {
            position: absolute;
            z-index: var(--z-hotspot);
            cursor: pointer;
            border: none;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            pointer-events: auto;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hotspot .hotspot-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
            border: 2px dashed rgba(255, 255, 255, 0.85);
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.25);
        }
        .hotspot:hover .hotspot-dot,
        .hotspot:active .hotspot-dot {
            background: rgba(0, 0, 0, 0.55);
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
            transform: scale(1.25);
        }
        .hotspot .hotspot-label {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #000;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
        }
        /* ===== 仅“笔记本电脑”与“白色按钮”的按键名改为白色 ===== */
        #hotspot-laptop .hotspot-label,
        #hotspot-whitebtn .hotspot-label {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        @media (max-width: 768px) {
            .hotspot .hotspot-dot {
                width: 26px;
                height: 26px;
            }
            .hotspot .hotspot-label {
                font-size: 8px;
                bottom: -18px;
            }
        }

        #hotspot-pillar {
            display: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-modal);
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
            pointer-events: auto;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-overlay.closing {
            animation: fadeOut 0.2s ease forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .modal-box {
            position: relative;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 28px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            pointer-events: auto;
            z-index: var(--z-modal-content);
            color: var(--text-light);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box h3 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            color: var(--accent);
            text-align: center;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .modal-box .modal-close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: #8b6e4b;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .modal-box .modal-close-btn:hover {
            color: #4a2e1a;
            background: rgba(139, 90, 43, 0.15);
        }

        #evidence-panel,
        #backpack-panel {
            position: fixed;
            right: 16px;
            bottom: 160px;
            width: 300px;
            max-width: 80vw;
            max-height: 50vh;
            background: var(--bg-panel);
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: var(--z-evidence-panel);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideInRight 0.3s ease;
        }
        #backpack-panel {
            bottom: 220px;
            border-color: #6a8daf;
            z-index: var(--z-backpack-panel);
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        #evidence-panel .panel-header,
        #backpack-panel .panel-header {
            padding: 12px 16px;
            background: var(--bg-panel-light);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent);
            cursor: default;
        }
        #backpack-panel .panel-header {
            color: #6a8daf;
        }
        #evidence-panel .evidence-list,
        #backpack-panel .backpack-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 60px;
        }
        #evidence-panel .evidence-item,
        #backpack-panel .backpack-item {
            background: rgba(139, 90, 43, 0.08);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            line-height: 1.4;
            border-left: 3px solid var(--accent);
            word-break: break-all;
            color: var(--text-warm);
        }
        #backpack-panel .backpack-item {
            border-left-color: #6a8daf;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #backpack-panel .backpack-item:hover {
            background: rgba(139, 90, 43, 0.15);
            border-left-color: #8ab8d8;
        }
        #backpack-panel .backpack-item.selected {
            background: rgba(106, 141, 175, 0.25);
            border-left-color: #fff;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
        }
        #evidence-panel .evidence-empty,
        #backpack-panel .backpack-empty {
            color: #9a8668;
            text-align: center;
            padding: 20px 0;
            font-size: 0.85rem;
        }
        #evidence-panel .panel-footer {
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: var(--bg-panel-light);
        }
        #evidence-counter {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-warm);
            letter-spacing: 2px;
        }
        #evidence-counter .count-num {
            color: var(--accent);
            font-size: 1.3rem;
        }
        #btn-return-hall {
            display: none;
            background: var(--accent);
            color: #f5e6d3;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.25s;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.35);
        }
        #btn-return-hall:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.5);
        }
        #btn-return-hall:active {
            transform: translateY(0);
        }
        #detective-code {
            display: none;
            font-size: 0.85rem;
            color: #6b4f2e;
            letter-spacing: 1px;
            font-weight: 600;
            background: rgba(139, 90, 43, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px dashed #8b5a2b;
        }

        /* ========== 角落按钮：文字纯黑 + 圆圈透明黑 ========== */
        #corner-buttons {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 55;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .corner-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.42);
            color: #000000;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            user-select: none;
        }
        .corner-btn .btn-icon {
            font-size: 1.4rem;
            line-height: 1;
            margin-bottom: 2px;
            pointer-events: none;
        }
        .corner-btn:hover {
            background: rgba(0, 0, 0, 0.58);
            border-color: rgba(0, 0, 0, 0.75);
            transform: scale(1.05);
        }
        .corner-btn:active {
            transform: scale(0.95);
        }
        .corner-btn.evidence-btn {
            border-color: rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.42);
        }
        .corner-btn.evidence-btn .btn-icon {
            color: #000000;
        }
        .corner-btn.backpack-btn {
            border-color: rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.42);
        }
        .corner-btn.backpack-btn .btn-icon {
            color: #000000;
        }
        @media (max-width: 768px) {
            .corner-btn {
                width: 50px;
                height: 50px;
                font-size: 0.65rem;
            }
            .corner-btn .btn-icon {
                font-size: 1.2rem;
            }
            #corner-buttons {
                right: 10px;
                bottom: 10px;
                gap: 8px;
            }
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(62, 47, 31, 0.9);
            color: #f5e6d3;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1rem;
            z-index: var(--z-toast);
            pointer-events: none;
            animation: toastInOut 1.8s ease forwards;
            text-align: center;
            max-width: 80vw;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        @keyframes toastInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }

        /* ========== 通用按钮 ========== */
        .btn-generic,
        .btn-close-mini,
        .btn-confirm-puzzle,
        .btn-confirm-reward {
            background: var(--accent);
            color: #f5e6d3;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.25s;
        }
        .btn-generic:hover,
        .btn-close-mini:hover,
        .btn-confirm-puzzle:hover,
        .btn-confirm-reward:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-close-mini {
            padding: 6px 16px;
            font-size: 0.8rem;
            margin-top: 10px;
            align-self: center;
        }

        .image-modal-box {
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            max-width: 80vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
            overflow: visible;
        }
        .image-modal-box img {
            max-width: 70vw;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: var(--shadow);
            border: 2px solid rgba(139, 90, 43, 0.3);
            pointer-events: none;
        }

        /* =========================================================
           抽屉柜 UI（沿用之前风格）
           ========================================================= */
        .modal-box.drawer-modal-box {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            max-width: none;
            max-height: none;
            overflow: visible;
            box-shadow: none;
            animation: none;
        }
        .drawer-cabinet {
            position: relative;
            width: 260px;
            height: 360px;
            max-width: 88vw;
            max-height: 78vh;
            padding: 26px;
            border-radius: 18px;
            background:
                repeating-linear-gradient(
                    92deg,
                    rgba(139, 90, 43, 0.10) 0px,
                    rgba(139, 90, 43, 0) 2px,
                    rgba(139, 90, 43, 0.06) 4px,
                    rgba(139, 90, 43, 0) 8px,
                    rgba(255, 255, 255, 0.35) 10px,
                    rgba(255, 255, 255, 0) 14px
                ),
                linear-gradient(160deg, #ffffff 0%, #fdf9f2 48%, #f5e9d6 100%);
            box-shadow:
                0 26px 60px rgba(0, 0, 0, 0.55),
                inset 0 2px 0 rgba(255, 255, 255, 0.14),
                inset 0 -4px 10px rgba(0, 0, 0, 0.5),
                inset 4px 0 10px rgba(0, 0, 0, 0.22),
                inset -4px 0 10px rgba(0, 0, 0, 0.22);
            display: flex;
            flex-direction: column;
            gap: 26px;
            animation: slideUp 0.3s ease;
        }
        .drawer-slot {
            flex: 1 1 0;
            min-height: 0;
            border-radius: 10px;
            background:
                repeating-linear-gradient(
                    92deg,
                    rgba(0, 0, 0, 0.08) 0px,
                    rgba(0, 0, 0, 0) 3px,
                    rgba(0, 0, 0, 0.05) 6px,
                    rgba(0, 0, 0, 0) 10px
                ),
                linear-gradient(180deg, #b57a44 0%, #8b5a2b 50%, #5c3a1e 100%);
            box-shadow:
                0 6px 12px rgba(0, 0, 0, 0.55),
                inset 0 2px 0 rgba(255, 255, 255, 0.22),
                inset 0 -3px 8px rgba(0, 0, 0, 0.42),
                inset 2px 0 4px rgba(0, 0, 0, 0.2),
                inset -2px 0 4px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: filter 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
        }
        .drawer-slot:hover { filter: brightness(1.12); }
        .drawer-slot:active {
            transform: translateY(2px);
            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.55),
                inset 0 2px 0 rgba(255, 255, 255, 0.14),
                inset 0 -2px 6px rgba(0, 0, 0, 0.5),
                inset 2px 0 4px rgba(0, 0, 0, 0.25),
                inset -2px 0 4px rgba(0, 0, 0, 0.25);
        }
        .drawer-handle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 28%,
                        #ffe98a 0%, #f5c518 42%, #d4a100 72%, #9a7300 100%);
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(245, 197, 24, 0.22),
                inset 0 -2px 4px rgba(0, 0, 0, 0.32),
                inset 0 2px 3px rgba(255, 255, 255, 0.78);
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .drawer-cabinet {
                width: 200px;
                height: 290px;
                padding: 20px;
                gap: 20px;
                border-radius: 14px;
            }
            .drawer-handle { width: 22px; height: 22px; }
        }

        /* =========================================================
           电脑弹窗 UI（浅蓝磨砂 + 蓝色渐变桌面）
           ========================================================= */
        .computer-modal-box {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            overflow: visible;
            max-width: 92vw;
            max-height: 88vh;
        }
        .win-boot-screen {
            width: 640px;
            max-width: 92vw;
            height: 440px;
            max-height: 78vh;
            padding: 0 30px;
            border-radius: 16px;
            background: linear-gradient(160deg, rgba(232, 244, 255, 0.95) 0%, rgba(184, 215, 242, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 24px 60px rgba(10, 40, 80, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        .win-boot-logo {
            width: 78px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            line-height: 1;
            color: #4a88c4;
            animation: spin 2s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .win-boot-text {
            color: #3a668f;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-align: center;
        }
        .win-boot-screen .modal-close-btn { color: #4a7aa8; font-size: 18px; }
        .win-boot-screen .modal-close-btn:hover { color: #1f4a72; background: rgba(255, 255, 255, 0.65); }

        .win-lock-screen {
            position: relative;
            width: 640px;
            max-width: 92vw;
            height: 440px;
            max-height: 78vh;
            padding: 30px;
            border-radius: 16px;
            background: linear-gradient(160deg,
                        rgba(234, 245, 255, 0.94) 0%,
                        rgba(180, 214, 243, 0.88) 55%,
                        rgba(148, 192, 231, 0.92) 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 26px 60px rgba(10, 40, 80, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.95),
                inset 0 -18px 40px rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(22px) saturate(1.35);
            -webkit-backdrop-filter: blur(22px) saturate(1.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        .win-lock-screen::before {
            content: '';
            position: absolute;
            top: -110px;
            right: -70px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
        }
        .win-lock-screen::after {
            content: '';
            position: absolute;
            bottom: -90px;
            left: -60px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(140, 195, 245, 0.55) 0%, rgba(140, 195, 245, 0) 70%);
            pointer-events: none;
        }
        .win-lock-avatar {
            position: relative;
            z-index: 1;
            width: 126px;
            height: 126px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 34% 28%, #ffffff 0%, #dcebfa 48%, #a9cdec 100%);
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 14px 34px rgba(35, 80, 130, 0.32),
                inset 0 -8px 18px rgba(120, 165, 210, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .win-lock-hint {
            position: relative;
            z-index: 1;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 3px;

        /* =========================================================
           升起的立柱：横向棕色木纹长条 + 四根白色竖条 + 三角按钮
           ========================================================= */
        .modal-box.pillar-modal-box {
            background: transparent;

            animation: slideUp 0.3s ease;

        .pillar-bars-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: var(--bar-gap);
        }
        .pillar-bar-track {
            width: var(--bar-w);
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .pillar-bar {
            width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #f4f4f4 100%);
            border-radius: 8px 8px 0 0;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.28),
                inset 0 -4px 8px rgba(120, 75, 30, 0.14),
                inset 0 2px 0 rgba(255, 255, 255, 0.95),
                inset 3px 0 4px rgba(255, 255, 255, 0.7),
                inset -3px 0 4px rgba(0, 0, 0, 0.06);
            transition: height 0.32s ease;
        }
        .pillar-brown-bar {
            width: calc(4 * var(--bar-w) + 3 * var(--bar-gap));
            max-width: 92vw;
            height: 90px;
            border-radius: 4px;
            background:
                repeating-linear-gradient(
                    92deg,
                    rgba(120, 75, 30, 0.20) 0px,
                    rgba(120, 75, 30, 0) 3px,
                    rgba(120, 75, 30, 0.12) 6px,
                    rgba(120, 75, 30, 0) 11px,
                    rgba(255, 255, 255, 0.18) 14px,
                    rgba(255, 255, 255, 0) 18px
                ),
                linear-gradient(180deg, #e8d4b4 0%, #d4b896 50%, #bfa075 100%);
            border: 1px solid rgba(120, 75, 30, 0.45);
            box-shadow:
                0 10px 22px rgba(80, 50, 20, 0.38),
                inset 0 2px 0 rgba(255, 255, 255, 0.65),
                inset 0 -2px 5px rgba(120, 75, 30, 0.32);
        }
        .pillar-btns-row {
            display: flex;
            justify-content: center;
            gap: var(--bar-gap);
            margin-top: -62px;
            position: relative;
            z-index: 2;
        }
        .pillar-btn-pair {
            width: var(--bar-w);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .pillar-tri {
            width: 0;
            height: 0;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4));
            transition: transform 0.15s ease, filter 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .pillar-tri.up {
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-bottom: 15px solid #8b5a2b;
        }
        .pillar-tri.down {
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 15px solid #8b5a2b;
        }
        .pillar-tri:hover { transform: scale(1.18); filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5)); }
        .pillar-tri:active { transform: scale(0.9); }

        @media (max-width: 768px) {
            .pillar-strip {

                top: 22px;

            .laptop-folder-item .lfi-icon { font-size: 1.4rem; }
            .laptop-folder-item .lfi-name { font-size: 0.62rem; }
        }

</head>
<body>

    <!-- 主舞台 -->
    <div id="main-stage">

        </button>

        </button>
        <!-- 热点：笔记本电脑 -->

        </button>
        <!-- 热点：白色按钮 -->
        <button class="hotspot" id="hotspot-whitebtn" data-x="839" data-y="425" aria-label="白色按钮">

        </button>

            <span class="hotspot-dot"></span>

        </button>
    </div>

    <!-- 右下角按钮组（文字黑色 + 透明黑圆圈） -->
    <div id="corner-buttons">
        <button class="corner-btn evidence-btn" id="btn-toggle-evidence" aria-label="证据栏">
            <span class="btn-icon">🔍</span>
            <span>证据</span>
        </button>
        <button class="corner-btn backpack-btn" id="btn-toggle-backpack" aria-label="背包栏">
            <span class="btn-icon">🎒</span>
            <span>背包</span>
        </button>
    </div>

    <!-- 证据栏 -->
    <div id="evidence-panel">
        <div class="panel-header">
            <span>📋 证据栏</span>
            <span style="font-size:0.8rem;color:#8b6e4b;">点击外部关闭</span>
        </div>
        <div class="evidence-list" id="evidence-list">
            <div class="evidence-empty" id="evidence-empty">暂无证据</div>
        </div>
        <div class="panel-footer">
            <div id="evidence-counter"><span class="count-num" id="evidence-count-num">0</span> / 4</div>
            <div id="detective-code">侦探助手录入码：cbxd0855</div>
            <button id="btn-return-hall" onclick="goToPage3()">返回大厅</button>
        </div>
    </div>

    <!-- 背包栏 -->
    <div id="backpack-panel">
        <div class="panel-header">
            <span>🎒 背包</span>
            <span style="font-size:0.8rem;color:#8b6e4b;">点击物品选中</span>
        </div>
        <div class="backpack-list" id="backpack-list">
            <div class="backpack-empty" id="backpack-empty">背包空空如也</div>
        </div>
    </div>

    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script>
        // ==================== 全局状态 ====================
        const state = {
            evidenceCollected: new Set(),
            backpackItems: [],
            selectedBackpackItem: null,
            familyPhotoShowingFront: true,
            laptopBooted: false,
            folderUnlocked: false,
            pillarValues: [1, 1, 1, 1],
            whitePuzzleSolved: false,
            backgroundSwitched: false,
        };

        const EVIDENCE_ZHENZHI = 'evidence_zhenzhi';
        const EVIDENCE_FAMILY_PHOTO = 'evidence_family_photo';
        const EVIDENCE_CASE_FILE = 'evidence_case_file';
        const EVIDENCE_REPORT = 'evidence_report';
        const TOTAL_EVIDENCE = 4;

        const ORIGINAL_WIDTH = 911;
        const ORIGINAL_HEIGHT = 512;

        const bgImage = document.getElementById('bg-image');
        const bgContainer = document.getElementById('bg-container');
        const hotspots = document.querySelectorAll('.hotspot');
        const modalContainer = document.getElementById('modal-container');
        const toastContainer = document.getElementById('toast-container');
        const evidencePanel = document.getElementById('evidence-panel');
        const backpackPanel = document.getElementById('backpack-panel');
        const evidenceList = document.getElementById('evidence-list');
        const evidenceEmpty = document.getElementById('evidence-empty');
        const evidenceCountNum = document.getElementById('evidence-count-num');
        const btnReturnHall = document.getElementById('btn-return-hall');
        const detectiveCode = document.getElementById('detective-code');
        const backpackList = document.getElementById('backpack-list');
        const backpackEmpty = document.getElementById('backpack-empty');
        const btnToggleEvidence = document.getElementById('btn-toggle-evidence');
        const btnToggleBackpack = document.getElementById('btn-toggle-backpack');

        // ==================== 工具函数 ====================
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 1900);
        }

        function closeAllModals() { modalContainer.innerHTML = ''; }

        function openModal(html, options = {}) {
            closeAllModals();
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.setAttribute('data-modal-overlay', 'true');
            if (options.zIndex) overlay.style.zIndex = options.zIndex;
            const box = document.createElement('div');
            box.className = 'modal-box';
            if (options.customClass) box.classList.add(options.customClass);
            box.innerHTML = html;
            if (options.closeOnOverlay !== false) {
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(overlay); });
            }
            const closeBtn = box.querySelector('.modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => closeModal(overlay));
            overlay.appendChild(box);
            modalContainer.appendChild(overlay);
            return { overlay, box };
        }

        function closeModal(overlay) {
            if (!overlay) return;
            overlay.classList.add('closing');
            setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
        }

        function collectEvidence(evidenceId, displayText) {
            if (state.evidenceCollected.has(evidenceId)) return;
            state.evidenceCollected.add(evidenceId);
            updateEvidencePanel();
            showToast('📌 已收录证据：' + displayText);
        }

        function updateEvidencePanel() {
            const count = state.evidenceCollected.size;
            evidenceCountNum.textContent = count;
            if (count === 0) {
                evidenceEmpty.style.display = 'block';
                evidenceList.querySelectorAll('.evidence-item').forEach(el => el.remove());
                btnReturnHall.style.display = 'none';
                detectiveCode.style.display = 'none';
                return;
            }
            evidenceEmpty.style.display = 'none';
            evidenceList.querySelectorAll('.evidence-item').forEach(el => el.remove());
            const evidenceDisplayMap = {
                [EVIDENCE_ZHENZHI]: '一个刻着赵的镇纸',
                [EVIDENCE_FAMILY_PHOTO]: '全家福照片',
                [EVIDENCE_CASE_FILE]: '赵氏集团案件资料',
                [EVIDENCE_REPORT]: '一份案件报道剪报',
            };
            state.evidenceCollected.forEach(eid => {
                const item = document.createElement('div');
                item.className = 'evidence-item';
                item.textContent = evidenceDisplayMap[eid] || eid;
                evidenceList.appendChild(item);
            });
            if (count >= TOTAL_EVIDENCE) {
                btnReturnHall.style.display = 'block';
                detectiveCode.style.display = 'block';
            } else {
                btnReturnHall.style.display = 'none';
                detectiveCode.style.display = 'none';
            }
        }

        function toggleEvidencePanel(show) {
            if (show === undefined) show = evidencePanel.style.display !== 'flex';
            evidencePanel.style.display = show ? 'flex' : 'none';
        }

        function toggleBackpackPanel(show) {
            if (show === undefined) show = backpackPanel.style.display !== 'flex';
            backpackPanel.style.display = show ? 'flex' : 'none';
            if (show) updateBackpackPanel();
        }

        function addToBackpack(itemId, itemName, itemIcon) {
            if (state.backpackItems.some(item => item.id === itemId)) return;
            state.backpackItems.push({ id: itemId, name: itemName, icon: itemIcon || '📦' });
            updateBackpackPanel();
            showToast('🎒 获得：' + itemName);
        }

        function removeFromBackpack(itemId) {
            const idx = state.backpackItems.findIndex(item => item.id === itemId);
            if (idx > -1) {
                state.backpackItems.splice(idx, 1);
                if (state.selectedBackpackItem === itemId) state.selectedBackpackItem = null;
                updateBackpackPanel();
            }
        }

        function updateBackpackPanel() {
            backpackList.querySelectorAll('.backpack-item').forEach(el => el.remove());
            if (state.backpackItems.length === 0) {
                backpackEmpty.style.display = 'block';
                return;
            }
            backpackEmpty.style.display = 'none';
            state.backpackItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'backpack-item';
                if (state.selectedBackpackItem === item.id) el.classList.add('selected');
                el.innerHTML = `<span>${item.icon}</span><span>${item.name}</span>`;
                el.addEventListener('click', (e) => { e.stopPropagation(); selectBackpackItem(item.id); });
                backpackList.appendChild(el);
            });
        }

        function selectBackpackItem(itemId) {
            if (state.selectedBackpackItem === itemId) state.selectedBackpackItem = null;
            else {
                const item = state.backpackItems.find(i => i.id === itemId);
                if (item) { state.selectedBackpackItem = itemId; showToast('已选中：' + item.name); }
            }
            updateBackpackPanel();
        }

        function getBackpackItem(itemId) { return state.backpackItems.find(i => i.id === itemId); }

        document.addEventListener('click', (e) => {
            if (evidencePanel.style.display === 'flex' && !evidencePanel.contains(e.target) && e.target !== btnToggleEvidence && !btnToggleEvidence.contains(e.target)) toggleEvidencePanel(false);
            if (backpackPanel.style.display === 'flex' && !backpackPanel.contains(e.target) && e.target !== btnToggleBackpack && !btnToggleBackpack.contains(e.target)) toggleBackpackPanel(false);
        });

        btnToggleEvidence.addEventListener('click', (e) => { e.stopPropagation(); toggleEvidencePanel(); });
        btnToggleBackpack.addEventListener('click', (e) => { e.stopPropagation(); toggleBackpackPanel(); });

        // ==================== 热点定位 ====================
        function positionHotspots() {
            const imgRect = bgImage.getBoundingClientRect();
            const containerRect = bgContainer.getBoundingClientRect();
            hotspots.forEach(hotspot => {
                const x = parseFloat(hotspot.dataset.x);
                const y = parseFloat(hotspot.dataset.y);
                const pctX = x / ORIGINAL_WIDTH;
                const pctY = y / ORIGINAL_HEIGHT;
                const imgDisplayLeft = imgRect.left - containerRect.left;
                const imgDisplayTop = imgRect.top - containerRect.top;
                const imgDisplayWidth = imgRect.width;
                const imgDisplayHeight = imgRect.height;
                const hotspotX = imgDisplayLeft + pctX * imgDisplayWidth;
                const hotspotY = imgDisplayTop + pctY * imgDisplayHeight;
                hotspot.style.left = (hotspotX / containerRect.width * 100) + '%';
                hotspot.style.top = (hotspotY / containerRect.height * 100) + '%';
            });
        }

        // ==================== 热点事件 ====================
        document.getElementById('hotspot-crane').addEventListener('click', () => openCrane());
        document.getElementById('hotspot-drawer').addEventListener('click', () => openDrawer());
        document.getElementById('hotspot-family').addEventListener('click', () => openFamilyPhoto());
        document.getElementById('hotspot-laptop').addEventListener('click', () => openLaptop());
        document.getElementById('hotspot-whitebtn').addEventListener('click', switchBackgroundToB1);
        document.getElementById('hotspot-pillar').addEventListener('click', () => openWhiteButtonPuzzle());

        // ==================== 1. 千纸鹤 ====================
        function openCrane() {
            const html = `
                <div class="modal-box image-modal-box" style="position:relative;display:flex;align-items:center;justify-content:center;">
                    <img src="pic19.jpg" alt="千纸鹤" draggable="false" />
                    <button class="modal-close-btn" style="position:absolute;top:12px;right:16px;background:rgba(0,0,0,0.4);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">✕</button>
                </div>
            `;
            const { overlay, box } = openModal(html, { customClass: 'image-modal-box', closeOnOverlay: true });
            const closeBtn = box.querySelector('.modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => closeModal(overlay));
        }

        // ==================== 2. 抽屉（2层） ====================
        function openDrawer() {
            const html = `
                <div class="drawer-cabinet">
                    <div class="drawer-slot" data-drawer="1">
                        <div class="drawer-handle"></div>
                    </div>
                    <div class="drawer-slot" data-drawer="2">
                        <div class="drawer-handle"></div>
                    </div>
                </div>
            `;
            const { overlay, box } = openModal(html, { closeOnOverlay: true, customClass: 'drawer-modal-box' });

            box.querySelectorAll('.drawer-slot').forEach(slot => {
                const idx = parseInt(slot.dataset.drawer);
                slot.addEventListener('click', () => {
                    if (idx === 1) {
                        const imgHtml = `
                            <div class="modal-box image-modal-box" style="position:relative;display:flex;align-items:center;justify-content:center;">
                                <img src="pic20.jpg" alt="抽屉内容" draggable="false" />
                                <button class="modal-close-btn" style="position:absolute;top:12px;right:16px;background:rgba(0,0,0,0.4);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">✕</button>
                            </div>
                        `;
                        const { overlay: imgOverlay, box: imgBox } = openModal(imgHtml, { customClass: 'image-modal-box', closeOnOverlay: true });
                        const imgClose = imgBox.querySelector('.modal-close-btn');
                        if (imgClose) imgClose.addEventListener('click', () => closeModal(imgOverlay));
                        collectEvidence(EVIDENCE_ZHENZHI, '一个刻着赵的镇纸');
                    } else if (idx === 2) {
                        showToast('无法打开');
                    }
                });
            });
        }

        // ==================== 3. 全家福合影 ====================
        function openFamilyPhoto() {
            const html = `
                <h3>👨‍👩‍👧 全家福合影</h3>
                <div style="text-align:center;margin-bottom:12px;position:relative;">
                    <img id="family-img" src="${state.familyPhotoShowingFront ? 'pic22.jpg' : 'pic23.jpg'}" alt="全家福" style="max-width:70vw;max-height:50vh;object-fit:contain;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.2);" draggable="false" />
                    <button id="btn-switch-photo" style="position:absolute;top:10px;right:10px;background:rgba(139,90,43,0.8);border:none;color:#f5e6d3;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;">↻</button>
                </div>
                <p style="text-align:center;font-size:1rem;color:var(--text-warm);letter-spacing:1px;font-weight:600;">全家福照片</p>
                <button class="modal-close-btn">✕</button>
            `;
            const { overlay, box } = openModal(html, { closeOnOverlay: true });
            const closeBtn = box.querySelector('.modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => closeModal(overlay));

            const switchBtn = box.querySelector('#btn-switch-photo');
            const img = box.querySelector('#family-img');
            switchBtn.addEventListener('click', () => {
                state.familyPhotoShowingFront = !state.familyPhotoShowingFront;
                img.src = state.familyPhotoShowingFront ? 'pic22.jpg' : 'pic23.jpg';
            });

            collectEvidence(EVIDENCE_FAMILY_PHOTO, '全家福照片');
        }

        // ==================== 4. 笔记本电脑（含子窗口） ====================
        function openLaptop() {
            if (!state.laptopBooted) {
                showLaptopBoot();
            } else {
                showLaptopDesktop();
            }
        }

        function showLaptopBoot() {
            const html = `
                <div class="win-boot-screen">
                    <div class="win-boot-logo">🪟</div>
                    <div class="win-boot-text">正在启动系统...</div>
                    <button class="modal-close-btn">✕</button>
                </div>
            `;
            const { overlay, box } = openModal(html, { closeOnOverlay: true, customClass: 'computer-modal-box' });
            const closeBtn = box.querySelector('.modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => closeModal(overlay));
            setTimeout(() => { if (overlay.parentNode) { state.laptopBooted = true; closeModal(overlay); showLaptopDesktop(); } }, 1500);
        }

        function showLaptopDesktop() {
            const html = `
                <div class="win-desktop" id="laptop-desktop">
                    <div class="win-desktop-topbar">Windows 10</div>
                    <div class="win-desktop-icons">
                        <div class="win-desktop-icon" data-file-id="painting" title="绘画练习">
                            <span class="icon-img">🖼️</span>
                            <span class="icon-name">绘画练习</span>
                        </div>
                        <div class="win-desktop-icon" data-folder-id="materials" title="资料">
                            <span class="icon-img">📁</span>
                            <span class="icon-name">资料</span>
                        </div>
                    </div>
                    <div class="win-desktop-taskbar">
                        <div class="win-taskbar-start"><span class="start-icon">⊞</span><span>开始</span></div>
                    </div>
                    <div class="win-subwindows" id="win-subwindows"></div>
                    <button class="modal-close-btn">✕</button>
                </div>
            `;
            const { overlay, box } = openModal(html, { closeOnOverlay: false, customClass: 'computer-modal-box' });
            const closeBtn = box.querySelector('.modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => closeModal(overlay));
            box.querySelectorAll('.win-desktop-icon').forEach(icon => {
                icon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (icon.dataset.fileId === 'painting') {
                        // 绘画练习 → 子窗口显示图片
                        openLaptopSubWindow(`
                            <img src="pic24.jpg" alt="绘画练习" draggable="false" />
                        `);
                    } else if (icon.dataset.folderId === 'materials') {
                        // 资料 → 若无解锁则先验证密码
                        if (state.folderUnlocked) {
                            openLaptopFolderContent();
                        } else {
                            openLaptopFolderPassword();
                        }
                    }
                });
            });
        }

        // ---------- 子窗口工具 ----------
        function removeAllLaptopSubWindows() {
            document.querySelectorAll('#laptop-desktop .win-subwindow').forEach(el => el.remove());
        }

        function openLaptopSubWindow(contentHtml) {
            removeAllLaptopSubWindows();
            const desktop = document.getElementById('laptop-desktop');
            if (!desktop) return null;
            const container = desktop.querySelector('#win-subwindows');
            if (!container) return null;

            const rect = container.getBoundingClientRect();
            const margin = 10;
            const iconArea = Math.min(110, rect.width * 0.28);

            let size = Math.min(
                rect.height - margin * 2,
                rect.width - iconArea - margin
            );
            if (size < 150) size = 150;

            const win = document.createElement('div');
            win.className = 'win-subwindow';
            win.style.width = size + 'px';
            win.style.height = size + 'px';
            win.style.right = margin + 'px';
            win.style.top = '50%';
            win.style.marginTop = (-size / 2) + 'px';

            win.innerHTML = `
                <button class="win-subwindow-close" aria-label="关闭">✕</button>
                <div class="win-subwindow-body">${contentHtml}</div>
            `;
            win.querySelector('.win-subwindow-close').addEventListener('click', (e) => {
                e.stopPropagation();
                win.remove();
            });
            container.appendChild(win);
            return win;
        }

        function openLaptopFolderPassword() {
            openLaptopSubWindow(`
                <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px;">
                    <div style="font-size:2.2rem;line-height:1;">📁</div>
                    <div style="font-size:0.82rem;color:#2a4a6b;font-weight:600;">请输入文件夹密码</div>
                    <div style="display:flex;gap:8px;justify-content:center;align-items:center;width:100%;">
                        <input type="password" id="laptop-folder-pass" maxlength="10" placeholder="••••" 
                            style="flex:1;max-width:140px;height:36px;border:1px solid #b8d0e8;border-radius:18px;padding:0 14px;font-size:0.9rem;text-align:center;letter-spacing:4px;color:#24486c;outline:none;background:rgba(255,255,255,0.8);font-family:inherit;" />
                        <button id="laptop-folder-pass-btn" aria-label="进入"
                            style="width:36px;height:36px;border-radius:50%;border:none;background:linear-gradient(160deg,#74b0e2 0%,#3d7cba 100%);color:#fff;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(45,95,150,0.35);">→</button>
                    </div>
                    <div id="laptop-folder-pass-error" style="color:#c0392b;font-size:0.75rem;min-height:14px;text-align:center;font-weight:600;"></div>
                </div>
            `);
            const win = document.querySelector('#laptop-desktop .win-subwindow:last-child');
            if (!win) return;
            const input = win.querySelector('#laptop-folder-pass');
            const btn = win.querySelector('#laptop-folder-pass-btn');
            const err = win.querySelector('#laptop-folder-pass-error');
            function tryPass() {
                if (input.value.trim() === '4767') {
                    state.folderUnlocked = true;
                    openLaptopFolderContent();
                } else {
                    err.textContent = '密码错误';
                    input.value = '';
                    input.focus();
                }
            }
            btn.addEventListener('click', tryPass);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryPass(); });
            setTimeout(() => input.focus(), 200);
        }

        function openLaptopFolderContent() {
            const items = [
                { type: 'content', icon: '📄', name: '案件资料' },
                { type: 'locked', icon: '📄', name: '舒代华资料' },
                { type: 'locked', icon: '📄', name: '舒代华日程表' },
                { type: 'locked', icon: '🎥', name: '案发当天监控' },
                { type: 'locked', icon: '📄', name: '走访调查记录' },
            ];
            const contentHtml = `
                <div class="subwindow-title">📁 资料</div>
                <div class="subwindow-content" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;align-content:flex-start;">
                    ${items.map((it, i) => `
                        <div class="laptop-folder-item" data-index="${i}" data-type="${it.type}">
                            <div class="lfi-icon">${it.icon}</div>
                            <div class="lfi-name">${it.name}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            openLaptopSubWindow(contentHtml);
            const win = document.querySelector('#laptop-desktop .win-subwindow:last-child');
            if (!win) return;
            win.querySelectorAll('.laptop-folder-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const type = item.dataset.type;
                    if (type === 'content') {
                        openLaptopCaseFile();
                        collectEvidence(EVIDENCE_CASE_FILE, '赵氏集团案件资料');
                    } else {
                        showToast('🔒 无查看权限');
                    }
                });
            });
        }

        function openLaptopCaseFile() {
            const caseHtml = `
                <div class="subwindow-title">📄 案件资料</div>
                <div class="subwindow-content" style="font-size:0.8rem;line-height:1.75;color:#2a4a6b;">
                    <strong>案发时间：</strong>根据法医判断死亡时间在当天的17点左右<br><br>
                    <strong>嫌疑人：</strong>当天有两个人曾前往家中，一名是当时考拉集团的中层领导舒代华，另一个是一名外卖员，至今还没有查出具体身份，还需进一步调查判断真凶。<br><br>
                    <strong>现场：</strong>现场有打斗痕迹，但是没有财物丢失，后续了解得知，舒代华是去送两个集团合作的具体方案文件的，记录了文件的U盘在案发后丢失。三名死者均有多处致命伤，系打斗所致，激情杀人的可能性大。
                </div>
            `;
            openLaptopSubWindow(caseHtml);
        }

        // ==================== 5. 白色按钮 -> 切换背景 ====================
        function switchBackgroundToB1() {
            if (state.backgroundSwitched) return;
            bgImage.style.opacity = '0';
            setTimeout(() => {
                bgImage.src = 'b1.jpg';
                bgImage.onload = () => {
                    bgImage.style.opacity = '1';
                    const pillarBtn = document.getElementById('hotspot-pillar');
                    if (pillarBtn) {
                        pillarBtn.style.display = 'flex';
                        positionHotspots();
                    }
                };
                bgImage.onerror = () => {
                    bgImage.style.opacity = '1';
                    const pillarBtn = document.getElementById('hotspot-pillar');
                    if (pillarBtn) {
                        pillarBtn.style.display = 'flex';
                        positionHotspots();
                    }
                };
            }, 300);
            state.backgroundSwitched = true;
        }

        // ==================== 6. 升起的立柱（横向棕色木纹长条） ====================
        function openWhiteButtonPuzzle() {
            if (state.whitePuzzleSolved) {
                showWhiteButtonReward();
                return;
            }
            const html = `
                <div class="pillar-strip" id="pillar-strip">
                    <div class="pillar-bars-row">
                        ${state.pillarValues.map((val, idx) => `
                            <div class="pillar-bar-track" data-pillar-index="${idx}">
                                <div class="pillar-bar" style="height: ${val * 45}px;"></div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="pillar-brown-bar"></div>
                    <div class="pillar-btns-row">
                        ${state.pillarValues.map((val, idx) => `
                            <div class="pillar-btn-pair" data-pillar-index="${idx}">
                                <button class="pillar-tri up" data-dir="up" aria-label="升高"></button>
                                <button class="pillar-tri down" data-dir="down" aria-label="降低"></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            const { overlay, box } = openModal(html, { closeOnOverlay: true, customClass: 'pillar-modal-box' });

            function updatePillars() {
                const bars = box.querySelectorAll('.pillar-bar');
                bars.forEach((bar, idx) => {
                    bar.style.height = (state.pillarValues[idx] * 45) + 'px';
                });
            }

            function checkPuzzleAuto() {
                const target = [1, 4, 2, 3];
                const isCorrect = state.pillarValues.every((val, idx) => val === target[idx]);
                if (isCorrect) {
                    state.whitePuzzleSolved = true;
                    closeModal(overlay);
                    setTimeout(() => showWhiteButtonReward(), 250);
                }
            }

            box.querySelectorAll('.pillar-tri').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const pair = btn.closest('.pillar-btn-pair');
                    const idx = parseInt(pair.dataset.pillarIndex);
                    const dir = btn.dataset.dir;
                    if (dir === 'up' && state.pillarValues[idx] < 4) {
                        state.pillarValues[idx]++;
                        updatePillars();
                    } else if (dir === 'down' && state.pillarValues[idx] > 1) {
                        state.pillarValues[idx]--;
                        updatePillars();
                    }
                    checkPuzzleAuto();
                });
            });
        }

        function showWhiteButtonReward() {
            const html = `
                <h3>🔘 升起的立柱</h3>
                <div class="puzzle-reward-display" style="text-align:center;padding:20px;">
                    <img src="pic21.jpg" alt="案件报道剪报" draggable="false" style="max-width:70vw;max-height:50vh;object-fit:contain;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.2);cursor:pointer;" id="reward-img" />
                    <div class="reward-text" style="margin-top:12px;font-size:1rem;color:var(--text-warm);letter-spacing:1px;font-weight:600;">一份案件报道剪报</div>
                    <button class="btn-confirm-reward" id="btn-collect-report" style="margin-top:16px;">收集证据</button>
                </div>
                <button class="modal-close-btn">✕</button>
            `;
            const { overlay, box } = openModal(html, { closeOnOverlay: true });
            const closeBtn = box.querySelector('.modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => closeModal(overlay));

            const img = box.querySelector('#reward-img');
            if (img) {
                img.addEventListener('click', () => {
                    const imgHtml = `
                        <div class="modal-box image-modal-box" style="position:relative;display:flex;align-items:center;justify-content:center;">
                            <img src="pic21.jpg" alt="案件报道剪报" draggable="false" />
                            <button class="modal-close-btn" style="position:absolute;top:12px;right:16px;background:rgba(0,0,0,0.4);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">✕</button>
                        </div>
                    `;
                    const { overlay: imgOverlay, box: imgBox } = openModal(imgHtml, { customClass: 'image-modal-box', closeOnOverlay: true });
                    const imgClose = imgBox.querySelector('.modal-close-btn');
                    if (imgClose) imgClose.addEventListener('click', () => closeModal(imgOverlay));
                });
            }

            const collectBtn = box.querySelector('#btn-collect-report');
            if (collectBtn) {
                collectBtn.addEventListener('click', () => {
                    collectEvidence(EVIDENCE_REPORT, '一份案件报道剪报');
                    closeModal(overlay);
                });
            }
        }

        // ==================== 返回大厅 ====================
        function goToPage3() {
            window.location.href = 'page3.html';
        }

        // ==================== 初始化 ====================
        function init() {
            updateEvidencePanel();
            updateBackpackPanel();
            positionHotspots();
            window.addEventListener('resize', positionHotspots);
            window.addEventListener('orientationchange', () => { setTimeout(positionHotspots, 300); });
            bgImage.addEventListener('load', positionHotspots);
            if (bgImage.complete) positionHotspots();
        }

        init();
    </script>
