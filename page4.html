<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>审讯 · 夜莺别墅命案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:#1a1a2e;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;user-select:none;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(139,90,43,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(139,90,43,.55)}

/* ========== 主容器 ========== */
.main-container{
  width:100%;max-width:960px;
  height:92vh;max-height:880px;
  background:#f5f0eb;border-radius:28px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.2);
}

/* ========== 顶部角色按钮 ========== */
.char-buttons{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  padding:14px 12px 8px;
  background:rgba(255,255,240,.7);
  backdrop-filter:blur(6px);
  border-bottom:1px solid #d9cdb8;
  flex-shrink:0;
}
.char-btn{
  background:#e8dccf;border:none;padding:10px 18px;
  border-radius:22px;font-size:15px;font-weight:500;
  letter-spacing:1px;color:#3e2e1f;cursor:pointer;
  transition:all .2s;box-shadow:0 2px 4px rgba(0,0,0,.1);
  white-space:nowrap;font-family:inherit;position:relative;
}
.char-btn.active{
  background:#8b5a2b;color:#fff;
  box-shadow:0 4px 10px rgba(107,68,35,.4);
}
.char-btn:active{transform:scale(.96)}
.char-btn.solved::after{
  content:'✓';position:absolute;top:-3px;right:-3px;
  width:16px;height:16px;line-height:16px;font-size:10px;
  background:#5a9e6f;color:#fff;border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}

/* ========== 压力条 ========== */
.pressure-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 20px 10px;
  background:rgba(255,255,240,.5);
  border-bottom:1px solid #e2d7c5;
  flex-shrink:0;
}
.pressure-label{
  font-size:12px;color:#8b7355;letter-spacing:2px;white-space:nowrap;
}
.pressure-track{
  flex:1;height:9px;border-radius:999px;
  background:#e2d7c5;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.18);
}
.pressure-fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#b8823f,#d8a34d,#f0c060);
  box-shadow:0 0 10px rgba(216,163,77,.7);
  transition:width .9s cubic-bezier(.2,.9,.3,1);
}
.pressure-num{
  font-family:ui-monospace,Menlo,monospace;
  font-size:13px;color:#8b5a2b;min-width:42px;text-align:right;font-weight:700;
}

/* ========== 交互区 ========== */
.interact-area{
  display:flex;flex:1;min-height:0;position:relative;
}

/* 左侧人物 */
.character-display{
  width:140px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding:20px 8px 30px;
  background:#fff;border-right:1px solid #e0d6c8;
  flex-shrink:0;
}
.char-image{
  width:100%;max-width:110px;height:auto;
  object-fit:contain;
  filter:drop-shadow(0 4px 12px rgba(139,90,43,.2));
  margin-bottom:12px;
  animation:charFloat 5s ease-in-out infinite;
}
@keyframes charFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.char-name{
  font-size:17px;font-weight:bold;color:#2e2416;
  letter-spacing:2px;text-align:center;min-height:24px;
}

/* 右侧聊天区 */
.chat-area{
  flex:1;display:flex;flex-direction:column;
  background:#faf7f2;min-width:0;
}
.messages-container{
  flex:1;overflow-y:auto;
  padding:20px 16px 10px;
  display:flex;flex-direction:column;gap:14px;
}

/* 消息行 */
.message-row{
  display:flex;width:100%;
  animation:fadeInUp .3s;
}
.message-row.player{justify-content:flex-end}
.message-row.npc{justify-content:flex-start}
.message-row.doubt{justify-content:flex-end}
.message-row.system{justify-content:center}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.bubble{
  max-width:80%;padding:12px 16px;border-radius:20px;
  font-size:15px;line-height:1.7;word-break:break-word;
  letter-spacing:.4px;transition:box-shadow .2s,background .2s;
}
.player .bubble{
  background:#8b5a2b;color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:0 3px 8px rgba(139,90,43,.25);
}
.npc .bubble{
  background:#e7dbcc;color:#2e2416;
  border-bottom-left-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,.06);
}
.doubt .bubble{
  background:linear-gradient(135deg,#c0392b,#96281b);
  color:#ffe8e3;border-bottom-right-radius:6px;
  box-shadow:0 4px 14px rgba(192,57,43,.4);
  font-weight:600;
}
.system .bubble{
  background:rgba(139,90,43,.08);
  border:1px dashed rgba(139,90,43,.3);
  color:#8b5a2b;font-size:13px;text-align:center;
  letter-spacing:1px;padding:8px 20px;
}

.bubble.clickable{cursor:pointer}
.bubble.clickable:hover{
  box-shadow:0 0 0 2px rgba(139,90,43,.35),0 2px 8px rgba(0,0,0,.15);
}
.npc .bubble.selected{
  background:#f5e8d3;
  box-shadow:0 0 0 3px #d8a34d,0 4px 16px rgba(216,163,77,.5);
}

/* 关键信息：未标记时与正文完全一致 */
.keyword{
  color:inherit;
  cursor:pointer;
  border-radius:3px;
  padding:0;
  transition:background .25s,color .25s,padding .25s,box-shadow .25s;
}
.keyword.marked{
  background:#ffd966;
  color:#5c3d0e;
  padding:1px 5px;
  cursor:default;
  box-shadow:0 0 10px rgba(255,217,102,.75);
  animation:keyPop .55s cubic-bezier(.2,1.4,.4,1);
}
@keyframes keyPop{
  0%{transform:scale(1.3);background:#ffe89a}
  100%{transform:scale(1)}
}

/* ========== 证据栏 ========== */
.evidence-bar{
  display:flex;gap:8px;padding:10px 14px;
  border-top:1px solid #e8ded0;
  overflow-x:auto;flex-shrink:0;
  background:rgba(255,255,245,.85);
}
.evidence-bar::-webkit-scrollbar{height:4px}
.ev-btn{
  padding:9px 16px;border-radius:20px;
  border:1px solid #c8b89a;background:#fff;
  color:#5a4632;font-size:13px;cursor:pointer;
  white-space:nowrap;transition:.2s;font-family:inherit;
  box-shadow:0 2px 5px rgba(0,0,0,.04);
  position:relative;
}
.ev-btn::before{
  content:'📄';margin-right:5px;font-size:12px;
}
.ev-btn:hover{
  border-color:#8b5a2b;color:#8b5a2b;
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(139,90,43,.18);
}
.ev-btn.selected{
  background:#8b5a2b;border-color:#8b5a2b;color:#fff;
  box-shadow:0 4px 12px rgba(107,68,35,.4);
}
.ev-btn.selected::before{content:'📌'}
.ev-btn.done{opacity:.45}
.ev-btn.done::after{content:' ✓';color:#5a9e6f;font-weight:700}
.ev-btn.done.selected::after{color:#b8f0c8}

/* ========== 操作栏 ========== */
.action-bar{
  display:flex;gap:10px;align-items:center;
  padding:10px 14px 14px;flex-shrink:0;
  background:rgba(255,255,245,.85);
  border-top:1px solid #e8ded0;
}
.action-bar-right{
  margin-left:auto;display:flex;gap:10px;
}
.action-btn{
  padding:12px 26px;border-radius:24px;
  font-size:14px;font-family:inherit;font-weight:600;
  letter-spacing:2px;cursor:pointer;transition:.22s;
  border:none;
}
.btn-interrogate{
  background:#8b5a2b;color:#fff;
  box-shadow:0 4px 12px rgba(107,68,35,.3);
}
.btn-interrogate:hover:not(:disabled){
  background:#a06a35;transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(107,68,35,.45);
}
.btn-interrogate:disabled{
  opacity:.4;cursor:not-allowed;box-shadow:none;
}
.btn-doubt{
  background:#fff;color:#c0392b;
  border:2px solid #c0392b;
  box-shadow:0 4px 12px rgba(192,57,43,.15);
}
.btn-doubt:hover:not(:disabled){
  background:#c0392b;color:#fff;
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(192,57,43,.45);
}
.btn-doubt:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-doubt.pulse{animation:doubtPulse 1.6s ease-in-out infinite}
@keyframes doubtPulse{
  0%,100%{box-shadow:0 4px 12px rgba(192,57,43,.15)}
  50%{box-shadow:0 0 26px rgba(192,57,43,.75)}
}
.btn-reason{
  background:linear-gradient(135deg,#d8a34d,#b8823f);
  color:#fff;
  box-shadow:0 4px 14px rgba(184,130,63,.4);
  animation:reasonGlow 2.2s ease-in-out infinite;
}
@keyframes reasonGlow{
  0%,100%{box-shadow:0 4px 14px rgba(184,130,63,.4)}
  50%{box-shadow:0 6px 28px rgba(216,163,77,.9)}
}
.btn-reason:hover{transform:translateY(-2px) scale(1.03)}
.btn-final{
  background:linear-gradient(135deg,#c0392b,#e74c3c);
  color:#fff;
  box-shadow:0 4px 14px rgba(192,57,43,.4);
  animation:finalGlow 2s ease-in-out infinite;
}
@keyframes finalGlow{
  0%,100%{box-shadow:0 4px 14px rgba(192,57,43,.4)}
  50%{box-shadow:0 6px 28px rgba(231,76,60,.9)}
}
.btn-final:hover{transform:translateY(-2px) scale(1.03)}

/* ========== 底部信息 ========== */
.bottom-info{
  flex-shrink:0;
  background:rgba(255,255,240,.6);
  border-top:1px solid #e2d7c5;
  padding:6px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.footer-credit{
  font-size:11px;color:#9b8b7a;letter-spacing:1px;
}
.footer-hint{
  font-size:12px;color:#8b7355;letter-spacing:1px;
}

/* ========== 连击 ========== */
.combo{
  position:fixed;top:60px;right:60px;z-index:600;
  font-size:44px;font-weight:900;letter-spacing:2px;
  color:#ff8a3d;pointer-events:none;opacity:0;
  text-shadow:
    0 0 20px rgba(255,138,61,.9),
    0 0 44px rgba(255,100,30,.7),
    0 4px 0 #a34812;
}
.combo.show{animation:comboAnim 5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes comboAnim{
  0%{transform:scale(0) rotate(-25deg);opacity:0}
  8%{transform:scale(1.35) rotate(7deg);opacity:1}
  15%{transform:scale(.95) rotate(-4deg)}
  21%{transform:scale(1.12) rotate(3deg)}
  27%{transform:scale(1) rotate(0);opacity:1}
  82%{transform:scale(1) rotate(0);opacity:1}
  100%{transform:scale(1.2) rotate(0);opacity:0}
}

/* ========== Toast ========== */
.toast{
  position:fixed;bottom:120px;left:50%;z-index:800;
  transform:translateX(-50%) translateY(14px);
  padding:12px 28px;border-radius:22px;
  background:rgba(44,36,22,.97);
  border:1px solid #c49a6c;
  color:#f0e6d2;font-size:14px;letter-spacing:1px;
  opacity:0;transition:.35s;pointer-events:none;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.fail{
  border-color:#c0392b;color:#ffb0a6;
  background:rgba(46,16,12,.97);
}

/* ========== 推理弹窗 ========== */
.modal{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:.45s;
}
.modal.show{opacity:1;visibility:visible}
.modal-box{
  width:100%;max-width:1000px;max-height:90vh;
  display:flex;flex-direction:column;
  border-radius:26px;
  background:#2c2416;color:#f0e6d2;
  border:1px solid #6b5a44;
  box-shadow:0 40px 100px rgba(0,0,0,.8);
  overflow:hidden;
  transform:translateY(20px) scale(.97);
  transition:transform .5s cubic-bezier(.2,.9,.3,1);
}
.modal.show .modal-box{transform:translateY(0) scale(1)}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 28px;flex-shrink:0;
  border-bottom:1px solid #4a3d29;
}
.modal-title{
  font-size:21px;letter-spacing:6px;color:#e8c98a;font-weight:700;
}
.modal-sub{font-size:11.5px;letter-spacing:2px;color:#8b7a5f;margin-top:5px}
.modal-close{
  width:36px;height:36px;border-radius:50%;
  border:1px solid #6b5a44;background:transparent;
  color:#b8a382;font-size:16px;cursor:pointer;
  transition:.22s;font-family:inherit;
}
.modal-close:hover{
  border-color:#e8c98a;color:#e8c98a;transform:rotate(90deg);
}
.modal-body{
  flex:1;overflow-y:auto;padding:30px 36px 18px;
}
.reason-line{
  font-size:17px;line-height:2.25;letter-spacing:.4px;
  color:#c8bba3;margin-bottom:20px;display:none;
}
.reason-line.show{
  display:block;
  animation:lineIn .7s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes lineIn{
  from{opacity:0;transform:translateY(14px);filter:blur(5px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}
.reason-line.final{color:#ff9e7a;text-shadow:0 0 22px rgba(255,140,90,.35)}
.reason-line.final .slot.filled{color:#ffb08c;text-shadow:0 0 16px rgba(255,150,100,.6)}

.slot{
  display:inline-block;vertical-align:baseline;
  min-width:88px;padding:0 9px 2px;margin:0 3px;
  border-bottom:1.5px dashed rgba(232,201,138,.5);
  background:rgba(232,201,138,.08);
  border-radius:5px 5px 0 0;text-align:center;
  transition:.22s;color:#c8bba3;cursor:pointer;
}
.slot:empty::before{
  content:'?';font-size:13px;color:rgba(232,201,138,.4);
}
.slot:hover:not(.filled){
  background:rgba(232,201,138,.2);
  border-bottom-color:#e8c98a;
}
.slot.over{
  background:rgba(232,201,138,.28);
  border-bottom-color:#e8c98a;
  box-shadow:0 8px 24px -8px rgba(232,201,138,.9);
}
.slot.wrong{
  background:rgba(226,86,77,.28);
  border-bottom-color:#e2564d;color:#ff9c90;
  animation:slotShake .45s cubic-bezier(.36,.07,.19,.97);
}
@keyframes slotShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
.slot.filled{
  min-width:0;padding:0 3px;margin:0 1px;
  border-bottom-color:transparent;background:transparent;
  color:#e8c98a;cursor:default;
  animation:inkIn 1s ease-out forwards;
}
@keyframes inkIn{
  0%{
    color:#fff6d0;
    text-shadow:0 0 26px rgba(232,201,138,1),0 0 10px rgba(232,201,138,.9);
    background:rgba(232,201,138,.25);
  }
  50%{
    color:#f5dfa8;
    text-shadow:0 0 14px rgba(232,201,138,.5);
    background:rgba(232,201,138,.08);
  }
  100%{
    color:#e8c98a;
    text-shadow:0 0 8px rgba(232,201,138,.35);
    background:transparent;
  }
}

.choice-row{
  display:none;gap:10px;margin:-8px 0 20px;padding-left:8px;
  flex-wrap:wrap;
}
.choice-row.show{display:flex;animation:lineIn .5s ease both}
.choice-btn{
  padding:9px 20px;border-radius:20px;
  border:1px solid #6b5a44;background:rgba(232,201,138,.06);
  color:#d6c6a8;font-size:14px;cursor:pointer;
  transition:.22s;font-family:inherit;
}
.choice-btn:hover{
  border-color:#e8c98a;color:#fff3d0;
  background:rgba(232,201,138,.18);transform:translateY(-2px);
}
.choice-btn.bad{
  border-color:#e2564d;color:#ff9c90;
  animation:slotShake .45s;
}

.modal-tray{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;
  padding:18px 36px;flex-shrink:0;
  border-top:1px solid #4a3d29;
  background:rgba(0,0,0,.25);min-height:100px;
}
.tray-label{
  font-size:11px;letter-spacing:4px;color:#8b7a5f;
  padding-right:18px;border-right:1px solid #4a3d29;margin-right:4px;
}

.reason-piece{
  padding:10px 18px;border-radius:10px;
  border:1px solid rgba(232,201,138,.4);
  background:linear-gradient(180deg,#3d3524,#2a2418);
  color:#f0e6d2;font-size:14.5px;letter-spacing:.4px;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 8px 22px rgba(0,0,0,.55);
  transition:.24s;
  animation:pieceFloat 5.4s ease-in-out infinite;
  animation-delay:var(--pd,0s);
}
@keyframes pieceFloat{
  0%,100%{transform:translateY(0) rotate(var(--pr,0deg))}
  50%{transform:translateY(-6px) rotate(var(--pr,0deg))}
}
.reason-piece:hover{
  border-color:#e8c98a;
  box-shadow:0 14px 32px rgba(0,0,0,.7),0 0 24px rgba(232,201,138,.3);
}
.reason-piece.selected{
  border-color:#e8c98a;
  background:linear-gradient(180deg,#5a4a2c,#3d321e);
  box-shadow:0 0 0 2px #e8c98a,0 12px 30px rgba(232,201,138,.5);
  animation:pieceSelected 1.4s ease-in-out infinite;
}
@keyframes pieceSelected{
  0%,100%{box-shadow:0 0 0 2px #e8c98a,0 8px 22px rgba(232,201,138,.4)}
  50%{box-shadow:0 0 0 2px #ffe6b0,0 12px 34px rgba(232,201,138,.85)}
}
.reason-piece.photo{
  padding:0;border:0;background:none;box-shadow:none;
}
.reason-piece.photo:hover{
  box-shadow:none;
  transform:translateY(-6px) rotate(var(--pr,0deg));
}
.reason-piece.photo.selected .rp-photo{
  box-shadow:0 0 0 3px #e8c98a,0 16px 34px -8px rgba(0,0,0,.9),
             0 0 26px rgba(232,201,138,.7);
  transform:translateY(-6px);
}
.rp-photo{
  position:relative;width:96px;padding:7px 7px 24px;
  background:linear-gradient(168deg,#f6f1e5,#ddd4bf);
  border-radius:2px;
  box-shadow:0 14px 28px -8px rgba(0,0,0,.85),0 3px 8px rgba(0,0,0,.5),
             inset 0 1px 0 rgba(255,255,255,.95);
  transition:.28s;
}
.rp-photo::before{
  content:'';position:absolute;top:-10px;left:50%;
  transform:translateX(-50%) rotate(-2deg);
  width:52px;height:19px;
  background:linear-gradient(180deg,rgba(232,220,188,.7),rgba(203,189,153,.45));
  border-left:1px solid rgba(255,255,255,.4);
  border-right:1px solid rgba(255,255,255,.4);
  box-shadow:0 2px 7px rgba(0,0,0,.45);
}
.rp-photo img{
  display:block;width:100%;aspect-ratio:4/3;
  object-fit:cover;border-radius:1px;background:#3a3a2e;
}
.rp-cap{
  position:absolute;left:7px;right:7px;bottom:6px;
  font-size:9px;color:#6b6049;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,Menlo,monospace;
}
.reason-piece.used{
  opacity:0;transform:scale(.7) rotate(-6deg);pointer-events:none;
}
.reason-piece.reject{animation:pieceShake .4s}
@keyframes pieceShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

.modal-foot{
  display:flex;justify-content:flex-end;
  padding:14px 36px 22px;flex-shrink:0;
}
.modal-finish{
  padding:14px 44px;border-radius:28px;
  border:1px solid #e8c98a;
  background:linear-gradient(180deg,rgba(232,201,138,.3),rgba(232,201,138,.1));
  color:#fff3d0;font-size:15px;font-family:inherit;
  letter-spacing:5px;text-indent:5px;font-weight:700;
  cursor:not-allowed;opacity:.3;transition:.3s;
}
.modal-finish.ready{
  cursor:pointer;opacity:1;
  box-shadow:0 0 40px rgba(232,201,138,.6);
  animation:finGlow 2s ease-in-out infinite;
}
@keyframes finGlow{
  0%,100%{box-shadow:0 0 22px rgba(232,201,138,.35)}
  50%{box-shadow:0 0 52px rgba(232,201,138,.8)}
}
.modal-finish.ready:hover{transform:translateY(-2px) scale(1.03)}

<!-- ========== 开场弹窗 ========== -->
<div class="modal-overlay" id="introModal">
  <div class="modal-content">
    <h3>操 作 说 明</h3>
    <ol>
      <li>选中下方<b>证据</b> → 点击 <b>审讯</b>，嫌疑人会作出回答。</li>
      <li>嫌疑人的证词中包含<b>关键信息</b>，找出并点击标黄，收集关键信息可增加压力值。</li>

      <li>压力拉满后可进入 <b>推理时刻</b>，点击线索气泡再点击空白处填入。</li>
      <li>所有嫌疑人审讯完毕后，点击 <b>最终推理</b>。</li>
    </ol>
    <button class="modal-btn" id="closeModalBtn">开始审讯</button>
  </div>
</div>

<!-- ========== 主容器 ========== -->
<div class="main-container">

  <!-- 嫌疑人标签 -->
  <div class="char-buttons" id="charButtons"></div>

  <!-- 压力值 -->
  <div class="pressure-row">
    <span class="pressure-label">压力值</span>
    <div class="pressure-track"><div class="pressure-fill" id="pressureFill"></div></div>
    <span class="pressure-num" id="pressureNum">0%</span>
  </div>

  <!-- 交互区 -->
  <div class="interact-area">

    <!-- 左侧人物 -->
    <div class="character-display">
      <img id="charImage" class="char-image" src="" alt="">
      <div class="char-name" id="currentCharName">　</div>
    </div>

    <!-- 右侧聊天 -->
    <div class="chat-area">
      <div class="messages-container" id="messagesContainer"></div>
      <div class="evidence-bar" id="evidenceBar"></div>
      <div class="action-bar">
        <button class="action-btn btn-interrogate" id="btnInterrogate">审 讯</button>
        <button class="action-btn btn-doubt" id="btnDoubt">质疑！！！</button>
        <div class="action-bar-right">
          <button class="action-btn btn-reason" id="btnReason" style="display:none">推理时刻</button>
          <button class="action-btn btn-final" id="btnFinal" style="display:none">最终推理</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-info">
    <div class="footer-credit">©爆炒霸王龙🦖制作</div>
    <div class="footer-hint">只有凶手会说谎，其他嫌疑人的话都可信</div>
  </div>
</div>

<!-- 连击 -->
<div class="combo" id="combo"></div>
<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ========== 推理弹窗 ========== -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <div class="modal-title">推理时刻</div>
        <div class="modal-sub">点击线索气泡 · 再点击空白处填入</div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-tray" id="modalTray">
      <span class="tray-label">线索池</span>
    </div>
    <div class="modal-foot">
      <button class="modal-finish" id="modalFinish" disabled>推理完成</button>
    </div>
  </div>
</div>

<div class="ending" id="ending">

    <p>案件脉络已重构 · 真相浮出水面</p>
    <button id="endingBack">继续审讯 →</button>
  </div>
</div>

/* =========================================================
   工具
   ========================================================= */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function scrollBottom(){ messagesContainer.scrollTop = messagesContainer.scrollHeight; }

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let toastTimer;
function toast(msg, fail){
  toastEl.textContent = msg;
  toastEl.classList.toggle('fail', !!fail);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2000);
}

function typeInto(el, text, speed=26){
  return new Promise(resolve=>{
    let i = 0;
    el.textContent = '';
    function tick(){
      if(i >= text.length){ resolve(); return; }
      const ch = text[i++];
      el.textContent += ch;
      scrollBottom();
      let d = speed;
      if('。！？'.includes(ch)) d = speed * 6;
      else if('，、；：'.includes(ch)) d = speed * 3.5;
      else if('…'.includes(ch)) d = speed * 4;
      setTimeout(tick, d);
    }
    tick();
  });
}

async function addMsg(text, type, opt={}){
  const row = document.createElement('div');
  row.className = 'message-row ' + type;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(bubble);
  messagesContainer.appendChild(row);
  scrollBottom();
  await typeInto(bubble, text, opt.speed || 26);
  const st = state.done[state.cur];
  if(opt.key) makeKeyword(bubble, opt.key, st);
  if(opt.evId) bubble.dataset.evId = opt.evId;
  if(opt.role) bubble.dataset.role = opt.role;
  if(opt.selectable){
    bubble.classList.add('clickable');
    bubble.addEventListener('click', ()=>selectBubble(bubble));
  }
  scrollBottom();
  return bubble;
}

function makeKeyword(el, keyText, st){
  const full = el.textContent;
  const idx = full.indexOf(keyText);
  if(idx === -1) return;
  const before = full.slice(0, idx);
  const after  = full.slice(idx + keyText.length);
  el.textContent = '';
  if(before) el.appendChild(document.createTextNode(before));
  const span = document.createElement('span');
  span.className = 'keyword';
  span.textContent = keyText;
  if(st.keys.has(keyText)){
    span.classList.add('marked');
  } else {
    span.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(span.classList.contains('marked')) return;
      span.classList.add('marked');
      st.keys.add(keyText);
      refreshPressure();
      toast('关键信息已收录');
    });
  }
  el.appendChild(span);
  if(after) el.appendChild(document.createTextNode(after));
}

function selectBubble(bubble){
  if(bubble.dataset.role !== 'answer') return;
  if(state.selectedBubble === bubble){
    bubble.classList.remove('selected');
    state.selectedBubble = null;
    return;
  }
  if(state.selectedBubble) state.selectedBubble.classList.remove('selected');
  state.selectedBubble = bubble;
  bubble.classList.add('selected');
}

/* =========================================================
   顶部标签
   ========================================================= */
function buildTabs(){
  charButtons.innerHTML = '';
  Object.keys(DATA).forEach(id=>{
    const s = DATA[id];
    const b = document.createElement('button');
    b.className = 'char-btn'
      + (id === state.cur ? ' active' : '')
      + (isNpcDone(id) ? ' solved' : '');
    b.textContent = s.name;
    b.dataset.id = id;
    b.addEventListener('click', ()=>switchSuspect(id));
    charButtons.appendChild(b);
  });
}

/* =========================================================
   切换嫌疑人
   ========================================================= */
async function switchSuspect(id){
  if(state.busy || id === state.cur) return;
  state.cur = id;
  state.selectedEvidence = null;
  state.selectedBubble = null;

  const s = DATA[id];
  document.querySelectorAll('.char-btn').forEach(t=>{
    t.classList.toggle('active', t.dataset.id === id);
  });

  currentCharName.textContent = s.name;
  charImage.src = s.pic;
  charImage.alt = s.name;
  charImage.style.display = 'block';
  charImage.onerror = function(){ this.style.display = 'none'; };

  renderHistory(id);
  buildEvidenceBar();
  refreshPressure();
}

/* 重建历史消息（含推理结论 & 供词） */
function renderHistory(npcId){
  const s = DATA[npcId];
  const st = state.done[npcId];
  messagesContainer.innerHTML = '';

  const intro = document.createElement('div');
  intro.className = 'message-row system';
  intro.innerHTML = '<div class="bubble">—— 审讯对象：' + s.name + ' ——</div>';
  messagesContainer.appendChild(intro);

  // 证据问答
  s.evidence.forEach(ev=>{
    if(!st.asked.has(ev.id)) return;

    addHistoryBubble(ev.q, 'player');

    const bubble = addHistoryBubble(ev.a, 'npc', ev.id, 'answer');
    if(ev.aKey) makeKeyword(bubble, ev.aKey, st);

    if(ev.extra){
      addHistoryBubble(ev.extra, 'player');
    }

    if(st.doubts.has(ev.id)){
      addHistoryBubble(ev.dq, 'doubt');
      const daBubble = addHistoryBubble(ev.da, 'npc');
      if(ev.dKey) makeKeyword(daBubble, ev.dKey, st);
    }
  });

  // 推理结论 + 供词（若已完成）
  if(st.reasoningDone && s.reasoning){
    addHistoryBubble(s.reasoning.finalText, 'player');
    if(st.confessShown && s.reasoning.confess){
      addHistoryBubble(s.reasoning.confess, 'npc');
      addHistoryBubble('（' + s.name + '的审讯已结束）', 'system');
    }
  }

  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function addHistoryBubble(text, type, evId, role){
  const row = document.createElement('div');
  row.className = 'message-row ' + type;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if(evId) bubble.dataset.evId = evId;
  if(role) bubble.dataset.role = role;
  if(role === 'answer'){
    bubble.classList.add('clickable');
    bubble.addEventListener('click', ()=>selectBubble(bubble));
  }
  row.appendChild(bubble);
  messagesContainer.appendChild(row);
  return bubble;
}

/* =========================================================
   证据栏
   ========================================================= */
function buildEvidenceBar(){
  const s = DATA[state.cur];
  evidenceBar.innerHTML = '';
  s.evidence.forEach(ev=>{
    const b = document.createElement('button');
    b.className = 'ev-btn';
    b.dataset.ev = ev.id;
    b.textContent = ev.label;
    if(state.done[state.cur].asked.has(ev.id)) b.classList.add('done');
    if(state.selectedEvidence === ev.id) b.classList.add('selected');
    b.addEventListener('click', ()=>{
      if(state.busy) return;
      state.selectedEvidence = (state.selectedEvidence === ev.id) ? null : ev.id;
      buildEvidenceBar();
    });
    evidenceBar.appendChild(b);
  });
}

/* =========================================================
   压力值 / 动作统计
   ========================================================= */
function isNpcDone(npcId){
  const s = DATA[npcId];
  const st = state.done[npcId];
  let total = 0;
  s.evidence.forEach(ev=>{
    if(ev.aKey) total++;
    if(ev.dq)  total++;
  });
  if(total === 0) return true;
  const done = st.keys.size + st.doubts.size;
  return done >= total;
}

function refreshPressure(){
  const s  = DATA[state.cur];
  const st = state.done[state.cur];
  const actions = st.keys.size + st.doubts.size;
  const perAction = s.pressurePerAction || 20;
  const pct = Math.min(100, actions * perAction);

  pressureFill.style.width = pct + '%';
  pressureNum.textContent = Math.round(pct) + '%';

  if(!s.reasoning){
    btnReason.style.display = 'none';
  } else if(pct >= 100){
    btnReason.style.display = '';
  } else {
    btnReason.style.display = 'none';
  }

  if(s.slow && isNpcDone(state.cur) && !st.osShown){
    st.osShown = true;
    setTimeout(()=>{ showOsPopup(s.osText); }, 800);
  }

  updateDoubtPulse();
  buildTabs();
  checkAllDone();
}

function updateDoubtPulse(){
  const s = DATA[state.cur];
  const st = state.done[state.cur];
  let can = false;
  s.evidence.forEach(ev=>{
    if(ev.dq && st.asked.has(ev.id) && !st.doubts.has(ev.id)) can = true;
  });
  btnDoubt.classList.toggle('pulse', can);
}

/* =========================================================
   审讯
   ========================================================= */
btnInterrogate.addEventListener('click', interrogate);
async function interrogate(){
  if(state.busy) return;
  const s  = DATA[state.cur];
  const st = state.done[state.cur];

  if(!state.selectedEvidence){
    toast('请先在下方选择一条证据', true);
    return;
  }
  const ev = s.evidence.find(e=>e.id === state.selectedEvidence);
  if(!ev) return;
  if(st.asked.has(ev.id)){
    toast('这条证据已经问过了', true);
    return;
  }

  state.busy = true;
  btnInterrogate.disabled = true;

  st.asked.add(ev.id);

  await addMsg(ev.q, 'player');
  await sleep(250);
  await addMsg(ev.a, 'npc', { key: ev.aKey, evId: ev.id, role: 'answer', selectable: true });

  if(ev.extra){
    await sleep(300);
    await addMsg(ev.extra, 'player');
  }

  buildEvidenceBar();
  state.selectedEvidence = null;

  state.busy = false;
  btnInterrogate.disabled = false;
  refreshPressure();
}

/* =========================================================
   质疑
   ========================================================= */
btnDoubt.addEventListener('click', doDoubt);
async function doDoubt(){
  if(state.busy) return;
  const s  = DATA[state.cur];
  const st = state.done[state.cur];

  if(!state.selectedBubble){
    toast('请先点击一条嫌疑人的回答', true);
    return;
  }

  const evId = state.selectedBubble.dataset.evId;
  const ev = s.evidence.find(e=>e.id === evId);

  if(!ev || !ev.dq){
    state.combo = 0;
    state.selectedBubble.classList.remove('selected');
    state.selectedBubble = null;
    toast('质疑失败 · 这条回答没有破绽', true);
    await addMsg('（你的质疑落空了，对方没有任何反应）', 'system');
    return;
  }
  if(st.doubts.has(ev.id)){
    toast('这条破绽已经质疑过了', true);
    return;
  }

  state.busy = true;
  btnDoubt.disabled = true;

  st.doubts.add(ev.id);

  state.combo++;
  if(state.combo >= 3) showCombo(state.combo);

  await addMsg(ev.dq, 'doubt');
  await sleep(300);
  await addMsg(ev.da, 'npc', { key: ev.dKey });

  state.selectedBubble.classList.remove('selected');
  state.selectedBubble = null;

  state.busy = false;
  btnDoubt.disabled = false;

  buildEvidenceBar();
  refreshPressure();
}

  comboEl.classList.remove('show');

  comboEl.classList.add('show');
  setTimeout(()=>comboEl.classList.remove('show'), 5000);
}

  `;
  inner.innerHTML = `
    <div style="font-size:12px;letter-spacing:6px;color:#e8c98a;margin-bottom:18px;font-weight:700">内 心 O S</div>
    <div>${text}</div>
  `;
  box.appendChild(inner);
  document.body.appendChild(box);
  requestAnimationFrame(()=>{
    box.style.opacity = '1';
    inner.style.transform = 'translateY(0)';
  });
  const close = document.createElement('button');
  close.textContent = '知道了';
  close.style.cssText = `
    display:block;margin:26px auto 0;padding:11px 34px;
    border-radius:28px;border:1px solid #e8c98a;
    background:rgba(232,201,138,.1);color:#e8c98a;
    font-family:inherit;font-size:14px;letter-spacing:3px;cursor:pointer;
  `;
  close.addEventListener('click', ()=>{
    box.style.opacity = '0';
    setTimeout(()=>box.remove(), 500);
  });
  inner.appendChild(close);
}

/* =========================================================
   推理时刻
   ========================================================= */
let selectedPiece = null;

btnReason.addEventListener('click', openReasoning);
function openReasoning(){
  const s = DATA[state.cur];
  if(!s.reasoning) return;
  buildReasoning(s.reasoning);
  modal.classList.add('show');
}

function buildReasoning(R){
  modalBody.innerHTML = '';
  modalTray.innerHTML = '<span class="tray-label">线索池</span>';
  selectedPiece = null;

  const lineEls = [];
  R.lines.forEach((line, li)=>{
    const p = document.createElement('div');
    p.className = 'reason-line' + (line.final ? ' final' : '');
    p.dataset.line = li;

    const re = /\{([^}]+)\}/g;
    let last = 0, m;
    const parts = [];
    while((m = re.exec(line.tpl)) !== null){
      if(m.index > last) parts.push({t:'txt', v: line.tpl.slice(last, m.index)});
      parts.push({t:'slot', id: m[1]});
      last = m.index + m[0].length;
    }
    if(last < line.tpl.length) parts.push({t:'txt', v: line.tpl.slice(last)});

    parts.forEach(part=>{
      if(part.t === 'txt'){
        p.appendChild(document.createTextNode(part.v));
      } else {
        const sp = document.createElement('span');
        sp.className = 'slot';
        sp.dataset.slot = part.id;
        sp.addEventListener('click', ()=>onSlotClick(sp, lineEls));
        p.appendChild(sp);
      }
    });

    modalBody.appendChild(p);
    lineEls.push(p);

    const choiceIds = parts.filter(x=>x.t==='slot').map(x=>x.id)
                           .filter(id => R.choices.some(c=>c.id===id));
    if(choiceIds.length){
      const row = document.createElement('div');
      row.className = 'choice-row';
      row.dataset.line = li;
      const ch = R.choices.find(c=>c.id === choiceIds[0]);
      ch.options.forEach(opt=>{
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = opt;
        b.addEventListener('click', ()=>{
          if(opt === ch.id){
            const slot = p.querySelector(`.slot[data-slot="${ch.id}"]`);
            slot.textContent = ch.id;
            slot.classList.add('filled');
            row.classList.remove('show');
            checkLineComplete(lineEls);
          } else {
            b.classList.add('bad');
            setTimeout(()=>b.classList.remove('bad'), 500);
          }
        });
        row.appendChild(b);
      });
      modalBody.appendChild(row);
    }
  });

  // 打乱线索气泡
  const shuffledPieces = shuffle(R.pieces);
  shuffledPieces.forEach((pc, i)=>{
    const el = document.createElement('div');
    el.className = 'reason-piece' + (pc.photo ? ' photo' : '');
    el.dataset.piece = pc.id;
    // ★ 填入后显示的文本
    if(pc.fillText) el.dataset.fillText = pc.fillText;
    el.style.setProperty('--pd', (-i*0.9)+'s');
    el.style.setProperty('--pr', pc.rot || '0deg');

    if(pc.photo){
      const wrap = document.createElement('div');
      wrap.className = 'rp-photo';
      const img = document.createElement('img');
      img.src = pc.photo;
      img.alt = '';
      img.onerror = function(){
        this.style.background = 'linear-gradient(150deg,#4a4433,#2a2418)';
        this.removeAttribute('src');
      };
      const cap = document.createElement('div');
      cap.className = 'rp-cap';
      cap.textContent = pc.text;
      wrap.appendChild(img);
      wrap.appendChild(cap);
      el.appendChild(wrap);
    } else {
      el.textContent = pc.text;
    }

    el.addEventListener('click', ()=>onPieceClick(el));
    modalTray.appendChild(el);
  });

  updateLineVisibility(lineEls);
  modalFinish.classList.remove('ready');
  modalFinish.disabled = true;
  modalFinish.textContent = '推理完成';
  modal._lineEls = lineEls;
}

function onPieceClick(piece){
  if(piece.classList.contains('used')) return;
  if(selectedPiece === piece){
    piece.classList.remove('selected');
    selectedPiece = null;
    return;
  }
  if(selectedPiece) selectedPiece.classList.remove('selected');
  selectedPiece = piece;
  piece.classList.add('selected');
}

function onSlotClick(slot, lineEls){
  if(slot.classList.contains('filled')) return;
  if(!selectedPiece){
    toast('请先点击下方一个线索', true);
    return;
  }
  const piece = selectedPiece;

  if(slot.dataset.slot === piece.dataset.piece){
    // ★ 填入时优先使用 fillText
    const fillText = piece.dataset.fillText || piece.dataset.piece;
    slot.textContent = fillText;
    slot.classList.add('filled');

    piece.classList.add('used');
    piece.classList.remove('selected');
    setTimeout(()=>{ piece.style.display = 'none'; }, 350);
    selectedPiece = null;

    const lineEl = slot.closest('.reason-line');
    const idx = lineEl.dataset.line;
    const row = modalBody.querySelector(`.choice-row[data-line="${idx}"]`);
    if(row) row.classList.remove('show');

    checkLineComplete(lineEls);
  } else {
    slot.classList.add('wrong');
    setTimeout(()=>slot.classList.remove('wrong'), 700);
    piece.classList.add('reject');
    setTimeout(()=>piece.classList.remove('reject'), 450);
  }
}

function updateLineVisibility(lineEls){
  lineEls.forEach((p, i)=>{
    const show = (i === 0) || isLineFilled(lineEls[i-1]);
    if(show && !p.classList.contains('show')){
      p.classList.add('show');
      const row = modalBody.querySelector(`.choice-row[data-line="${i}"]`);
      if(row){
        const hasEmptyChoice = Array.from(p.querySelectorAll('.slot'))
          .some(s => !s.classList.contains('filled'));
        if(hasEmptyChoice) row.classList.add('show');
      }
    }
  });
}

function isLineFilled(p){
  const slots = p.querySelectorAll('.slot');
  if(slots.length === 0) return true;
  return Array.from(slots).every(s=>s.classList.contains('filled'));
}

function checkLineComplete(lineEls){
  updateLineVisibility(lineEls);
  const allFilled = lineEls.every(p=>isLineFilled(p));
  if(allFilled){
    modalFinish.disabled = false;
    modalFinish.classList.add('ready');
  }
}

/* =========================================================
   关闭 / 完成
   ========================================================= */
$('#modalClose').addEventListener('click', ()=>{
  modal.classList.remove('show');
  selectedPiece = null;
});

modalFinish.addEventListener('click', async ()=>{
  if(modalFinish.disabled) return;
  const s  = DATA[state.cur];
  const st = state.done[state.cur];
  modal.classList.remove('show');
  selectedPiece = null;

  await sleep(400);
  await addMsg(s.reasoning.finalText, 'player', { speed: 14 });
  st.reasoningDone = true;

  await sleep(400);
  ending.classList.add('show');
});

$('#endingBack').addEventListener('click', async ()=>{
  ending.classList.remove('show');
  const s  = DATA[state.cur];
  const st = state.done[state.cur];
  await sleep(400);
  if(s.reasoning && s.reasoning.confess && !st.confessShown){
    await addMsg(s.reasoning.confess, 'npc', { speed: 18 });
    st.confessShown = true;
    await sleep(300);
    await addMsg('（' + s.name + '的审讯已结束）', 'system');
  }
  buildTabs();
  checkAllDone();
});

/* =========================================================
   最终推理
   ========================================================= */
function checkAllDone(){
  const all = Object.keys(DATA).every(id => isNpcDone(id));
  btnFinal.style.display = all ? 'inline-block' : 'none';
}

btnFinal.addEventListener('click', ()=>{
  window.location.href = 'page5.html';
});

/* =========================================================
   开场弹窗
   ========================================================= */
$('#closeModalBtn').addEventListener('click', ()=>{
  $('#introModal').style.display = 'none';
});

/* =========================================================
   初始化
   ========================================================= */
async function init(){
  buildTabs();
  const firstId = 'shu';
  state.cur = firstId;
  const s = DATA[firstId];
  currentCharName.textContent = s.name;
  charImage.src = s.pic;
  charImage.alt = s.name;
  charImage.onerror = function(){ this.style.display = 'none'; };
  document.querySelectorAll('.char-btn').forEach(t=>{
    t.classList.toggle('active', t.dataset.id === firstId);
  });

  renderHistory(firstId);
  buildEvidenceBar();
  refreshPressure();
}
init();
</script>
