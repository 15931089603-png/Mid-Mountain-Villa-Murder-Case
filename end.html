<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>结局 - 真相大白</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        background: #0d0906;
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 16px;
        position: relative;
    }

    /* ===== 全屏背景图 ===== */
    #end-bg {
        position: fixed;
        inset: 0;
        background-image: url('end.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
    }

    /* 背景之上的暗色遮罩，让文字更易读 */
    #end-bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(20, 12, 6, .25) 0%, rgba(20, 12, 6, .62) 100%);
        pointer-events: none;
    }

    /* ===== 内容容器 ===== */
    #ending-container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: endingFadeIn 1.1s ease forwards;
    }

    @keyframes endingFadeIn {
        from {
            opacity: 0;
            transform: translateY(26px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ===== 文本框 ===== */
    .ending-box {
        position: relative;
        width: 100%;
        background: rgba(28, 18, 10, .78);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 2px solid rgba(196, 154, 108, .75);
        border-radius: 16px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, .85), inset 0 0 0 1px rgba(255, 220, 180, .12);
        padding: 34px 30px 32px;
    }

    /* 四角装饰 */
    .ending-box::before,
    .ending-box::after {
        content: '';
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: #c49a6c;
        border-style: solid;
        opacity: .85;
    }

    .ending-box::before {
        top: -2px;
        left: -2px;
        border-width: 2px 0 0 2px;
        border-top-left-radius: 16px;
    }

    .ending-box::after {
        bottom: -2px;
        right: -2px;
        border-width: 0 2px 2px 0;
        border-bottom-right-radius: 16px;
    }

    /* 顶部小标题 */
    .ending-label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 22px;
    }

    .ending-label .line {
        flex: 1;
        max-width: 90px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #c49a6c);
    }

    .ending-label .line.right {
        background: linear-gradient(90deg, #c49a6c, transparent);
    }

    .ending-label .txt {
        font-size: 13px;
        letter-spacing: 6px;
        color: #d4b896;
        padding-left: 6px;
        white-space: nowrap;
    }

    /* 正文 */
    .ending-text {
        font-family: "Georgia", "Songti SC", "PingFang SC", serif;
        font-size: 17px;
        line-height: 2.15;
        color: #f0e4d2;
        letter-spacing: .8px;
        text-indent: 2em;
        text-align: justify;
        text-shadow: 0 2px 8px rgba(0, 0, 0, .7);
    }

    /* ===== 完结 ===== */
    .finish-mark {
        margin-top: 34px;
        text-align: center;
        animation: finishPulse 3s ease-in-out infinite;
    }

    .finish-mark .finish-text {
        font-family: "Georgia", "Songti SC", serif;
        font-size: 22px;
        letter-spacing: 10px;
        color: #e8d3ae;
        padding-left: 10px;
        text-shadow: 0 0 20px rgba(196, 154, 108, .8), 0 2px 10px rgba(0, 0, 0, .8);
    }

    @keyframes finishPulse {
        0%, 100% {
            opacity: .82;
            text-shadow: 0 0 18px rgba(196, 154, 108, .6), 0 2px 10px rgba(0, 0, 0, .8);
        }
        50% {
            opacity: 1;
            text-shadow: 0 0 32px rgba(219, 184, 140, 1), 0 2px 10px rgba(0, 0, 0, .8);
        }
    }

    /* ===== 版权 ===== */
    .copyright {
        margin-top: 46px;
        font-size: 13px;
        letter-spacing: 2px;
        color: rgba(212, 184, 150, .75);
        text-align: center;
        text-shadow: 0 1px 6px rgba(0, 0, 0, .9);
    }

    /* ===== 移动端适配 ===== */
    @media (max-width: 768px) {
        body {
            padding: 24px 14px;
        }

        .ending-box {
            padding: 26px 20px 24px;
            border-radius: 14px;
        }

        .ending-label .txt {
            font-size: 12px;
            letter-spacing: 5px;
        }

        .ending-text {
            font-size: 15.5px;
            line-height: 2.05;
        }

        .finish-mark .finish-text {
            font-size: 19px;
            letter-spacing: 8px;
        }

        .copyright {
            margin-top: 36px;
            font-size: 12px;
        }
    }

    @media (max-width: 420px) {
        body {
            padding: 18px 12px;
        }

        .ending-box {
            padding: 22px 16px 20px;
            border-radius: 12px;
        }

        .ending-label {
            margin-bottom: 16px;
        }

        .ending-label .txt {
            font-size: 11px;
            letter-spacing: 4px;
        }

        .ending-label .line {
            max-width: 50px;
        }

        .ending-text {
            font-size: 14px;
            line-height: 2;
            text-indent: 1.6em;
        }

        .finish-mark {
            margin-top: 26px;
        }

        .finish-mark .finish-text {
            font-size: 17px;
            letter-spacing: 6px;
        }

        .copyright {
            margin-top: 30px;
            font-size: 11px;
            letter-spacing: 1px;
        }
    }
</style>
</head>
<body>

    <!-- 全屏背景 -->
    <div id="end-bg"></div>

    <!-- 结局内容 -->
    <div id="ending-container">
        <div class="ending-box">
            <div class="ending-label">
                <span class="line"></span>
                <span class="txt">结 局</span>
                <span class="line right"></span>
            </div>
            <p class="ending-text">
                wer～wer～wer～的警车声响彻了别墅区，警察赶到后搜出了冯颖藏在地下室的凶器，带走了冯颖。十年前的两桩旧案，也重新展开调查，掩埋多年的真相，终究是大白于天下。而众人忙完一通才想起来那个窃取他人信息的卢华辑，本打算把他带走审问一番，却发现这家伙早就逃跑的无影无踪了！不过没关系，来日方长，终有一天，我会把这些不法分子绳之以法！
            </p>
        </div>

        <div class="finish-mark">
            <span class="finish-text">— 完 结 —</span>
        </div>

        <div class="copyright">©爆炒霸王龙🦖制作</div>
    </div>

</body>
</html>
